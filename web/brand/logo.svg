<svg width="680" height="180" viewBox="0 0 680 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoQGradDark" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7952FF"/>
      <stop offset="50%" stop-color="#9B70FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="logoTailGradDark" x1="100" y1="100" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7952FF"/>
    </linearGradient>
    <linearGradient id="textGradDark" x1="480" y1="40" x2="620" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7952FF"/>
    </linearGradient>
  </defs>

  <!-- Q Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Q Ring -->
    <path d="M 80 16
             C 120.8 16, 154 49.2, 154 90
             C 154 108.2, 147.5 124.9, 136.5 137.9
             L 114.3 115.7
             C 120.1 108.3, 123.6 99.6, 123.6 90
             C 123.6 65.9, 104.1 46.4, 80 46.4
             C 55.9 46.4, 36.4 65.9, 36.4 90
             C 36.4 114.1, 55.9 133.6, 80 133.6
             C 88.7 133.6, 96.9 130.4, 103.4 125.1
             L 125.5 147.2
             C 113.1 157.6, 97.3 164, 80 164
             C 39.2 164, 6 130.8, 6 90
             C 6 49.2, 39.2 16, 80 16 Z"
          fill="url(#logoQGradDark)"/>

    <!-- Cut Play Triangle inside Q -->
    <path d="M 70 70 L 102 90 L 70 110 Z" fill="#00E5FF"/>

    <!-- Sharp 45-deg Scissor Tail -->
    <path d="M 108 118 L 150 160 C 154 164, 160 164, 164 160 C 168 156, 168 150, 164 146 L 126 108 Z"
          fill="url(#logoTailGradDark)"/>
    
    <!-- Cyber Dot -->
    <circle cx="152" cy="38" r="7" fill="#00E5FF"/>
  </g>

  <!-- Wordmark "QlipIt" -->
  <text x="195" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="94" font-weight="900" letter-spacing="-1.5" fill="#0B0D13">
    Qlip<tspan fill="url(#textGradDark)">It</tspan>
  </text>

  <!-- Studio Pill Badge -->
  <rect x="525" y="58" width="105" height="32" rx="16" fill="rgba(121, 82, 255, 0.12)" stroke="#7952FF" stroke-width="2"/>
  <text x="577" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#7952FF" text-anchor="middle">STUDIO</text>
</svg>
