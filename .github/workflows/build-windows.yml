name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r desktop/requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Run test suite
        run: python tests/run.py

      - name: Build Windows App & Installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop\build.ps1

      - name: Verify build with self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath "desktop\dist\QlipIt\QlipIt.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QlipIt-Setup
          path: desktop/dist/installer/*.exe
          if-no-files-found: error

      - name: Publish Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
